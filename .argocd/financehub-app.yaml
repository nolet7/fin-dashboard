apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: financehub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nolet7/fin-dashboard.git
    targetRevision: feature/dev
    path: helm
  destination:
    server: https://kubernetes.default.svc
    namespace: financehub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

