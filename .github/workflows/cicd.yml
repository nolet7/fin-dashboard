name: CI/CD - Build & Push, Bump Helm (Argo deploys)

on:
  push:
    branches: [ "feature/dev" ]

permissions:
  contents: write  # allow committing the tag bump

env:
  IMAGE_REPO: docker.io/noletengine/financehub
  VERSION: v1.0.${{ github.run_number }}  # keep your versioning scheme

jobs:
  build-push-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.VERSION }}

      - name: Bump Helm image tag
        run: |
          sed -i 's#^\(\s*repository:\s*\).*#\1noletengine/financehub#' helm/values.yaml
          sed -i 's#^\(\s*tag:\s*\).*#\1'${{ env.VERSION }}'#' helm/values.yaml
          git config user.name  "github-actions"
          git config user.email "github@actions"
          git add helm/values.yaml
          git commit -m "chore(ci): update image tag to ${{ env.VERSION }}" || echo "no changes"
          git push

