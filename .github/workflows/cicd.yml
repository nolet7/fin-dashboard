name: CI/CD - Build, Scan, Push, Bump Helm (Argo sync)

on:
  push:
    branches: [ "feature/dev" ]

permissions:
  contents: write          # commit tag bump
  security-events: write   # upload SARIF to code scanning
  actions: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPO: docker.io/noletengine/financehub
  VERSION: v1.0.${{ github.run_number }}
  # Tweak scanners’ strictness:
  TRIVY_FAIL_ON: CRITICAL   # CRITICAL or CRITICAL,HIGH
  CHECKOV_SOFT_FAIL: "false"  # set "true" if you want non-blocking
  INGRESS_HOST: ${{ vars.INGRESS_HOST }} # optional repo var

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --no-git -v --redact --report-format sarif --report-path gitleaks.sarif
      - name: Upload SARIF (gitleaks)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif

  pytest:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps (if any)
        if: ${{ hashFiles('**/requirements*.txt') != '' }}
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt || true
      - name: Run pytest (only if tests exist)
        if: ${{ hashFiles('**/tests/**.py','**/test_*.py','**/*_test.py') != '' }}
        run: |
          pytest -q

  checkov:
    name: Dockerfile scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov on Dockerfiles
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: ${{ env.CHECKOV_SOFT_FAIL }}
      - name: Upload SARIF (checkov)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif

  sonarqube:
    name: Code analysis (SonarQube)
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

  build-push-bump:
    name: Build & push image, bump Helm tag
    runs-on: ubuntu-latest
    needs: [gitleaks, pytest, checkov, sonarqube]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.VERSION }}

      - name: Trivy image scan (fail on ${{ env.TRIVY_FAIL_ON }})
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ env.VERSION }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: ${{ env.TRIVY_FAIL_ON == 'CRITICAL' && '1' || '0' }}
        continue-on-error: ${{ env.TRIVY_FAIL_ON != 'CRITICAL' && env.TRIVY_FAIL_ON != 'CRITICAL,HIGH' }}
      - name: Upload SARIF (trivy)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

      - name: Ensure ingress host in values.yaml (optional)
        if: ${{ env.INGRESS_HOST != '' }}
        run: |
          sed -i "s#^\(\s*-\s*host:\s*\).*#\1${INGRESS_HOST}#" helm/values.yaml

      - name: Bump Helm image tag
        run: |
          sed -i 's#^\(\s*repository:\s*\).*#\1noletengine/financehub#' helm/values.yaml
          sed -i 's#^\(\s*tag:\s*\).*#\1'${{ env.VERSION }}'#' helm/values.yaml
          git config user.name  "github-actions"
          git config user.email "github@actions"
          git add helm/values.yaml
          git commit -m "ci: image ${{ env.VERSION }}; ingress host ${INGRESS_HOST}" || echo "no changes"
          git push

