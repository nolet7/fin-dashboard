name: CI/CD - Build, Scan, Push, Bump Helm (Argo sync)

on:
  push:
    branches: [ "feature/dev" ]

permissions:
  contents: write          # commit tag bump
  security-events: write   # upload SARIF to code scanning
  actions: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPO: docker.io/noletengine/financehub
  VERSION: v1.0.${{ github.run_number }}
  # Scanner knobs (Trivy is report-only now; no failing)
  CHECKOV_SOFT_FAIL: "false"       # set "true" to make Checkov advisory
  INGRESS_HOST: ${{ vars.INGRESS_HOST }} # optional repo var

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        # v2 writes results.sarif by default
      - name: Upload SARIF (gitleaks)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  pytest:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps (if any)
        if: ${{ hashFiles('**/requirements*.txt') != '' }}
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt || true
      - name: Run pytest (only if tests exist)
        if: ${{ hashFiles('**/tests/**.py','**/test_*.py','**/*_test.py') != '' }}
        run: pytest -q

  checkov:
    name: Dockerfile scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Checkov on Dockerfiles
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: ${{ env.CHECKOV_SOFT_FAIL }}
      - name: Upload SARIF (checkov)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif

  sonarcloud:
    name: Code analysis (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build-push-bump:
    name: Build & push image, bump Helm tag
    runs-on: ubuntu-latest
    needs: [gitleaks, pytest, checkov, sonarcloud]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.VERSION }}

      # --- TRIVY: report-only, keep building ---

      # Human-readable preview in logs (never fails)
      - name: Trivy image scan (table preview)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ env.VERSION }}
          format: 'table'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'   # do not fail

      # JSON report for summary parsing (never fails)
      - name: Trivy image scan (JSON report)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ env.VERSION }}
          format: 'json'
          output: 'trivy-image.json'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'   # do not fail

      # SARIF for GitHub Code Scanning (never fails)
      - name: Trivy image scan (SARIF upload)
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ env.VERSION }}
          format: 'sarif'
          output: 'trivy-image.sarif'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'   # do not fail
      - name: Upload SARIF (trivy)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif

      # Nice PASS/FAIL summary without failing the job
      - name: Trivy summary (PASS/FAIL but non-blocking)
        if: always()
        run: |
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-image.json 2>/dev/null || echo 0)
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-image.json 2>/dev/null || echo 0)
          status="PASS"
          if [ "$critical" -gt 0 ]; then status="FAIL (CRITICAL present)"; fi
          {
            echo "### Trivy Summary"
            echo ""
            echo "- Image: **${{ env.IMAGE_REPO }}:${{ env.VERSION }}**"
            echo "- Critical: **$critical**"
            echo "- High: **$high**"
            echo "- Gate (report-only): **$status**"
            echo ""
            echo "> Full findings are also in **Security → Code scanning alerts**."
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep a copy of reports as build artifacts
      - name: Upload Trivy artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-image.json
            trivy-image.sarif
          if-no-files-found: ignore
          retention-days: 7

      # --- end TRIVY block ---

      - name: Ensure ingress host in values.yaml (optional)
        if: ${{ env.INGRESS_HOST != '' }}
        run: |
          sed -i "s#^\(\s*-\s*host:\s*\).*#\1${INGRESS_HOST}#" helm/values.yaml

      - name: Bump Helm image tag
        run: |
          sed -i 's#^\(\s*repository:\s*\).*#\1noletengine/financehub#' helm/values.yaml
          sed -i 's#^\(\s*tag:\s*\).*#\1'${{ env.VERSION }}'#' helm/values.yaml
          git config user.name  "github-actions"
          git config user.email "github@actions"
          git add helm/values.yaml
          git commit -m "ci: image ${{ env.VERSION }}; ingress host ${INGRESS_HOST}" || echo "no changes"
          git push

