# Override file for local development
# This file is automatically loaded by docker-compose

services:
  financehub-dev:
    environment:
      - VITE_APP_ENV=development
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist

  # Override for using external PostgreSQL
  postgres:
    # Uncomment to disable the containerized PostgreSQL
      - disabled