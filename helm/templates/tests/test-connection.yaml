apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "financehub.fullname" . }}-test-connection"
  namespace: {{ .Values.namespaceOverride }}
  labels:
    {{- include "financehub.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: curlimages/curl:latest
      command: ['curl']
      args: ['http://{{ include "financehub.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never

