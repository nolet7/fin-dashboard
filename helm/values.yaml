# Default values for financehub
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: financehub
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: financehub.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Database configuration
# Option 1: Use envFromSecret (recommended for production)
envFromSecret: ""  # Set to secret name, e.g., "financehub-db"

# Option 2: Individual environment variables
env:
  DB_HOST: ""
  DB_PORT: "5432"
  DB_NAME: "financehub"
  DB_USER: "admin"
  DB_PASSWORD: ""
  NODE_ENV: "production"
  APP_PORT: "3000"

# Health checks
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5